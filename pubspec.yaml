name: apna_store
description: A new Flutter e-commerce project with Supabase backend.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # سپابیس کے لیے آفیشل ایس-ڈی-کے (SDK)
  supabase_flutter: ^2.8.0
  
  # اسٹیٹ مینیجمینٹ اور سروسز کے لیے پرووائیڈر
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
